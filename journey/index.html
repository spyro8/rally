<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231a10">
<title>Pixel Journey · test</title>
<style>
:root{--bg:#1d1610;--ink:#3a2c1a;--mut:#6f5a3a;--parch:#f2e5c4;--parch2:#e6d4a8;--wood:#6b4526;--wood-d:#3e2714;--gold:#e8c56a;--green:#43663a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1610}}
:root[data-theme="dark"]{--bg:#1d1610}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-tap-highlight-color:transparent}
.px{font-family:Pixelify,ui-monospace,monospace;letter-spacing:.02em}
.pxi{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-3px;flex:0 0 auto}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#0d1430}
#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
/* ---------- top HUD ---------- */
#hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:opacity .35s}
#hud>*{pointer-events:auto}
#place-btn{align-self:flex-start;display:flex;align-items:center;gap:9px;max-width:100%;font:inherit;color:var(--ink);cursor:pointer;border-style:solid;border-width:10px 14px;border-image:var(--kit-parch) 40 50 fill / 10px 14px stretch;background:none;padding:2px 4px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#place-btn .t{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
#cat{font-size:11px;color:var(--mut);text-transform:none}
#place{font-family:Pixelify,monospace;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.chev{font-size:10px;color:var(--mut);transition:transform .2s}#place-btn[aria-expanded=true] .chev{transform:rotate(90deg)}
#learn{max-width:360px;background:var(--parch);border:2px solid var(--wood-d);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.5;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#status{display:flex;flex-direction:column;gap:5px;align-self:flex-start}
.box{display:flex;align-items:center;gap:7px;color:#fbf4e2;background:rgba(18,14,9,.42);border:1px solid rgba(255,240,210,.28);border-radius:8px;padding:5px 9px 5px 7px;min-height:36px;min-width:112px;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.box span{display:flex;flex-direction:column;line-height:1.05}
.box b{font-size:14px;font-weight:800}.box b em{font-style:normal;font-weight:600;font-size:11px;opacity:.75;margin-left:3px}.box small{font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
#w-wx{cursor:pointer}
.meter{display:flex;align-items:center;gap:5px}.meter em{display:block;width:56px;height:6px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden}.meter u{display:block;height:100%;background:#6fb2e8}
#w-me{flex-direction:column;align-items:flex-start;gap:5px;justify-content:center}
#marks{display:flex;gap:5px}
.mk{width:26px;height:26px;display:grid;place-items:center;padding:0;cursor:pointer;background:rgba(20,16,10,.62);border:2px solid #7a6444;border-radius:4px;opacity:.75}
.mk.on{background:#5a3d24;border-color:var(--gold);opacity:1;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
#jr{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);font:700 16px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f3e6c8;border-style:solid;border-width:8px 12px;border-image:var(--kit-dark) 40 60 fill / 8px 12px stretch;padding:0 6px;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;font:700 15px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f3e6c8;background:rgba(24,18,10,.86);border:2px solid #7a6444;padding:7px 12px;white-space:nowrap;pointer-events:none}
/* ---------- bottom panel ---------- */
#panel{flex:0 0 auto;position:relative;padding:14px 12px calc(12px + env(safe-area-inset-bottom,0px));background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),linear-gradient(#6d4829,#553519);border-top:4px solid #2c1c0d;box-shadow:inset 0 3px 0 #8a5d35;display:flex;flex-direction:column;gap:10px;transition:transform .35s}
#panel:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#a57547;opacity:.6}
.navrow{display:flex;align-items:stretch;gap:8px}
.navbtn{width:48px;flex:0 0 48px;display:grid;place-items:center;font:700 18px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f3e6c8;cursor:pointer;background:none;border-style:solid;border-width:9px 11px;border-image:var(--kit-brown) 40 60 fill / 9px 11px stretch;padding:0}
.navbtn:disabled{opacity:.35;cursor:default}
.tag{flex:1;min-width:0;text-align:center;border-style:solid;border-width:10px 14px;border-image:var(--kit-parch) 40 50 fill / 10px 14px stretch;padding:0 4px}
#day{font:700 17px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
#dist{font:700 13px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--mut);display:flex;gap:5px;justify-content:center;align-items:center;margin-top:2px}
.ribbon{display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.22);border:2px solid #2c1c0d;padding:6px 8px 5px}
#ribbon{width:100%;height:40px;image-rendering:pixelated;display:block}
.rlab{display:flex;justify-content:space-between;font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e9d9b3}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.act{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;font:700 14px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f3e6c8;cursor:pointer;background:none;border-style:solid;border-width:9px 12px;border-image:var(--kit-dark) 40 60 fill / 9px 12px stretch;padding:0 2px;text-shadow:0 1px 0 #000}
.act.primary{border-image:var(--kit-green) 40 60 fill / 9px 12px stretch}
.act:active,.navbtn:active{filter:brightness(.9);transform:translateY(1px)}
.testrow{display:flex;gap:6px;align-items:center}
#t-toggle{font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#d9c79f;background:rgba(0,0,0,.25);border:1px dashed #a57547;padding:6px 10px;cursor:pointer}
#testbox{display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,.25);border:1px dashed #a57547;padding:8px}
#testbox label{display:flex;justify-content:space-between;font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e9d9b3}
#steps{width:100%;accent-color:#8fb46a}
.cyc{display:flex;gap:6px}.cyc button{flex:1;font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e9d9b3;background:rgba(0,0,0,.3);border:1px solid #a57547;padding:8px 6px;cursor:pointer}.cyc b{font-weight:400;color:#fff}
body.replaying #testbox,body.replaying .testrow{display:none}
/* ---------- entry card ---------- */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,5,.6);padding:16px;z-index:10;overflow:auto}
#book{z-index:10;justify-content:safe center;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#entry{z-index:30}
#book-tabs{z-index:2}
.card{width:100%;max-width:370px;max-height:88vh;overflow:auto;background:var(--parch);border:3px solid var(--wood-d);box-shadow:0 0 0 3px #a57547,0 20px 50px rgba(0,0,0,.5)}
#entry-img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;image-rendering:pixelated;border-bottom:3px solid var(--wood-d)}
.card .in{padding:14px 16px 16px}
#entry-cat{font:700 13px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--mut);display:flex;gap:6px;align-items:center}
#entry-title{font:400 23px/1.2 Pixelify,monospace;margin:4px 0 8px}
#entry-text{font-size:15px;line-height:1.55;margin:0 0 14px}
.close{width:100%;min-height:46px;font:700 15px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f3e6c8;cursor:pointer;background:none;border-style:solid;border-width:9px 12px;border-image:var(--kit-green) 40 60 fill / 9px 12px stretch}
/* ---------- journey book ---------- */
#book{flex-direction:column;gap:10px}
#book .bk{position:relative;flex:0 0 auto;width:min(360px,90vw,calc((100dvh - 190px) * var(--book-ratio)));aspect-ratio:var(--book-ratio);background:var(--book-frame) center/100% 100% no-repeat;image-rendering:pixelated;margin-top:30px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
#book-tabs{position:absolute;left:14%;right:10%;top:-28px;display:flex;gap:4px}
#book-tabs button{flex:1;font:700 12px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:#3a2c1a;border:2px solid #3a200f;border-bottom:0;padding:8px 2px 12px;cursor:pointer;border-radius:4px 4px 0 0;opacity:.85}
#book-tabs button.on{opacity:1;transform:translateY(-4px)}
#book-tabs [data-tab=map]{background:#a9c9e6}#book-tabs [data-tab=guide]{background:#e8a88f}#book-tabs [data-tab=log]{background:#c7b6e0}#book-tabs [data-tab=miles]{background:#efdc8e}
#book-page{position:absolute;inset:var(--book-inset);overflow:auto;padding:4px 6px}
#book-close{width:min(360px,90vw)}
.mapwrap{position:relative}
#parkmap{width:100%;height:min(46vh,340px);image-rendering:pixelated;border:2px solid #6b4526;display:block;touch-action:none;cursor:grab;background:#d9c9a0}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;font:800 20px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:#3a2c1a;background:#fbf3de;border:2px solid #5a3d24;border-radius:6px;box-shadow:0 2px 0 #3e2714;cursor:pointer}
.linkbtn{font:inherit;color:#7a3a1a;text-decoration:underline;background:none;border:0;padding:8px 0;cursor:pointer}
#book-page h3{font:400 21px/1.2 Pixelify,monospace;margin:0}#book-page .sub{font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--mut);margin:3px 0 12px}
#book-page h4{font:700 14px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:14px 0 6px;border-bottom:1px solid #cdb886;padding-bottom:3px}
#routemap{width:100%;image-rendering:pixelated;border:2px solid #8a6a40}
.stops{list-style:none;margin:10px 0 0;padding:0}.stops li{display:flex;justify-content:space-between;font:700 13px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:5px 0;border-bottom:1px dotted #cdb886;color:#9a876a}.stops li.on{color:var(--ink)}.stops li.on span:before{content:"\25CF  ";color:#43663a}
.entries{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ent{display:flex;gap:6px;align-items:center;text-align:left;font:700 12px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fbf3de;border:1px solid #b99c68;padding:8px;min-height:40px;cursor:pointer}.ent.locked{opacity:.45;cursor:default}
.journal{background:repeating-linear-gradient(transparent 0 25px,#d9c69c 25px 26px);padding:4px 2px;font-size:15px;line-height:26px;font-style:italic;color:var(--mut)}
.log{width:100%;border-collapse:collapse;font:700 13px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.log th{text-align:left;color:var(--mut);font-weight:400;padding:4px}.log td{padding:6px 4px;border-top:1px dotted #cdb886}.log tr.on td{background:#efe0b8}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stamp img{width:48px;height:48px;object-fit:contain}.tstamp{width:26px;height:26px;object-fit:contain;filter:sepia(.3) brightness(1.6)}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:8px 4px;min-width:0;border:2px dashed #b99c68;border-radius:14px;justify-content:center;opacity:.35;filter:grayscale(1)}.stamp.on{opacity:1;filter:none;border-style:solid;border-color:#a0522d;color:#7a3a1a;background:#fbf0d8}
#book-close{margin-top:8px}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#e9dfc6;background:var(--bg);font:400 18px Georgia,serif;z-index:20}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
#exit{position:absolute;top:10px;right:10px;z-index:3;min-height:40px;font:700 13px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:#f3e6c8;cursor:pointer;background:none;border-style:solid;border-width:8px 11px;border-image:var(--kit-dark) 40 60 fill / 8px 11px stretch;padding:0 4px;text-shadow:0 1px 0 #000}
.testrow[hidden]{display:none!important}
#sound{position:absolute;top:12px;right:92px;z-index:3;width:40px;height:40px;display:grid;place-items:center;color:#f3e6c8;cursor:pointer;background:rgba(18,14,9,.45);border:1px solid rgba(255,240,210,.3);border-radius:8px}

    for (const mk of MARKS) { if (z < 5 * dpr && !['Grizzly Giant', 'Glacier Point', 'Half Dome', 'El Capitan', 'Tenaya Lake', 'Tuolumne Meadows', 'Donohue Pass'].includes(mk.name)) continue; const [X, Y] = P(mk.m); if (X < -40 || X > W + 40 || Y < -20 || Y > H + 20) continue; x.strokeText(mk.name, X + 9 * dpr, Y - 12 * dpr); x.fillText(mk.name, X + 9 * dpr, Y - 12 * dpr); }
  }
}
function drawRouteMap(c, cur) {
  const x = c.getContext('2d'), W = c.width, H = c.height; x.imageSmoothingEnabled = false; x.fillStyle = '#e9dcb8'; x.fillRect(0, 0, W, H);
  const lo = 3800, hi = 11200, px = (m) => 12 + (m / TOTAL_M) * (W - 24), py = (m) => H - 22 - (elevAt(m) - lo) / (hi - lo) * (H - 50);
  for (let X = 12; X < W - 12; X++) { const m = (X - 12) / (W - 24) * TOTAL_M, y = Math.round(py(m)); x.fillStyle = m <= cur ? '#7fa35e' : '#cbb88c'; x.fillRect(X, y, 1, H - 18 - y); }
  x.fillStyle = '#6b5636'; x.font = '10px Pixelify, monospace';
  for (const m of MARKS) { const X = Math.round(px(m.m)), Y = Math.round(py(m.m)); x.fillStyle = cur >= m.m ? '#c9912c' : '#8a7550'; x.fillRect(X, Y - 14, 1, 12); x.fillRect(X - 2, Y - 17, 5, 4); }
  x.fillStyle = '#3a2c1a'; x.fillText('4,000 ft', 4, H - 6); x.fillText('11,000 ft', W - 60, 12);
  const X = Math.round(px(cur)), Y = Math.round(py(cur)); x.fillStyle = '#3a2c1a'; x.fillRect(X - 4, Y - 12, 9, 9); x.fillStyle = '#f4ecd2'; x.fillRect(X - 3, Y - 11, 7, 7); x.fillStyle = '#c8483a'; x.fillRect(X - 1, Y - 9, 3, 3);
}

/* milestones as they happen */
function checkMilestones(fromM, toM) {
  const s0 = { m: fromM, gain: gainTo(fromM), rest: false, highNight: false }, s1 = { m: toM, gain: gainTo(toM), rest: false, highNight: false };
  for (const m of MILESTONES) if (!m.test(s0) && m.test(s1)) toast(`<img class="tstamp" src="${A.stamps[m.stamp]}" alt=""> Stamp earned \u00b7 ${m.name}`);
}

/* journey replay: the whole trip so far in under a minute */
function startJourney() {
  const end = endM(TODAY()); if (end < 50) { toast('Nothing to replay yet'); return; }
  jr = { t0: performance.now(), dur: Math.min(60, Math.max(28, mi(end) * 2.4)) * 1000, end, day: 0, hour: 8, lastM: 0 }; camM = 0;
  $('#jr').hidden = false; document.body.classList.add('replaying');
}
function stopJourney() { if (!jr) return; jr = null; $('#jr').hidden = true; document.body.classList.remove('replaying'); setLoop(dayIdx); updatePanel(); }
$('#b-replay').onclick = () => startJourney();


/* ---------- placeholder music: a calm generated trail track with wind, birds, crickets, rain and campfire ---------- */
const MUSIC = window.SPYRTracks ? window.SPYRTracks.create({
  tracks: { day: '../audio/journey-day.mp3', night: '../audio/journey-night.mp3' },
  pick: (o) => (o.night ? 'night' : 'day'), volume: 0.55,
  fallback: window.SPYRMusic ? window.SPYRMusic.create() : null
}) : (window.SPYRMusic ? window.SPYRMusic.create() : null);
const SPK_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function musicUI() { const b = $('#sound'); if (b) { b.innerHTML = S.music !== false ? SPK_ON : SPK_OFF; b.setAttribute('aria-pressed', String(S.music !== false)); } }
function musicScene() { if (!MUSIC || !MUSIC.playing) return; const h = hourNow(); MUSIC.set({ mode: 'trail', night: darkness(h) > .55, weather: weatherFor(jr ? jr.day : dayIdx, camM, h), camp: isCamp(h) }); }
function musicGo() { if (!MUSIC || S.music === false) return; MUSIC.setMuted(false); MUSIC.set({ night: darkness(hourNow()) > .55 }); MUSIC.start(); musicScene(); }
document.addEventListener('pointerdown', () => musicGo(), { capture: true });
let musicWatch = performance.now();
setInterval(() => {                                         // the room stays loaded when hidden; frames stop, so the music does too
  if (!MUSIC) return; const idle = performance.now() - lastFrame > 1500;
  if (idle || document.hidden) MUSIC.suspend(); else { MUSIC.resume(); musicScene(); }
}, 1000);

/* ================= loop ================= */
function step(now) {
  const t = now / 1000, gap = now - (lastFrame || now), dt = Math.min(.05, gap / 1000); lastFrame = now; walking = false;
  if (gap > 1500 && MUSIC && S.music !== false) musicGo();
  if (jr) {
    const u = Math.min(1, (now - jr.t0) / jr.dur), prev = camM; camM = jr.end * u; walking = camM > prev;
    let d = 0; while (d < TODAY() && camM > endM(d)) d++; jr.day = d;
    const s = startM(d), e = endM(d); jr.hour = e > s ? 8 + 10.5 * Math.min(1, (camM - s) / (e - s)) : 19;
    $('#jr').textContent = `Day ${d + 1} \u00b7 ${fmtMi(camM)} mi`;
    for (const m of MARKS) if (prev < m.m && camM >= m.m) toast(`${iconImg('mountain', 14)} ${m.name}`);
    checkMilestones(prev, camM);
    if (u >= 1) { toast(`${iconImg('fire', 14)} ${fmtMi(jr.end)} miles so far`); stopJourney(); }
    else if (Math.floor(now / 250) !== Math.floor((now - dt * 1000) / 250)) { updateTop(); drawRibbon(); }
  } else if (isCamp(hourNow())) {
    camM = loop.b; walking = false;
  } else if (loop.phase === 'walk') {
    camM += WALK_PX / PPM * dt; walking = true;
    if (camM >= loop.b) { camM = loop.b; loop.phase = 'pause'; loop.until = t + 5; walking = false; }
    updateTop();
  } else if (loop.phase === 'pause') {
    if (t > loop.until) { fade = Math.min(1, fade + dt * 2); if (fade >= 1) { camM = loop.a; loop.phase = 'fadein'; } }
  } else if (loop.phase === 'fadein') { fade = Math.max(0, fade - dt * 2); if (fade <= 0) loop.phase = 'walk'; }
  render(t); requestAnimationFrame(step);
}
if (EMBED) { document.body.classList.add('embedded'); $('#exit').hidden = false; $('#exit').onclick = (ev) => { ev.stopPropagation(); try { MUSIC && MUSIC.stop(); } catch { } try { parent.postMessage({ type: 'spyr:journey-exit' }, location.origin); } catch { } }; }
$('#sound').onclick = (ev) => { ev.stopPropagation(); S.music = S.music === false; saveState(); musicUI(); if (!MUSIC) return; if (S.music) musicGo(); else MUSIC.setMuted(true); };
if (!TEST && EMBED) { $('.testrow').hidden = true; $('#testbox').hidden = true; }
loadAll().then(loadIcons).then(() => { makeIcons(); fit(); setLoop(dayIdx); updatePanel(); $('#b-book').insertAdjacentHTML('afterbegin', iconImg('book', 16)); $('#b-guide').insertAdjacentHTML('afterbegin', iconImg('bulb', 16)); $('#b-replay').insertAdjacentHTML('afterbegin', iconImg('boot', 16)); $('#loading').hidden = true; ready = true; musicUI(); if (pendingDays) setDays(pendingDays); requestAnimationFrame(step); });
/* SPYR hands us your daily steps; your journey starts the first day you open it */
function setDays(list) {
  if (!S.start) { S.start = dkey(new Date()); saveState(); }
  const by = new Map((list || []).map((x) => [x.date, Number(x.steps) || 0]));
  const out = [], d0 = new Date(S.start + 'T12:00:00'), end = new Date(); end.setHours(12, 0, 0, 0);
  for (let d = new Date(d0); d <= end; d.setDate(d.getDate() + 1)) out.push({ date: new Date(d), steps: by.get(dkey(d)) || 0 });
  if (!out.length) out.push({ date: new Date(), steps: 0 });
  const wasToday = dayIdx === days.length - 1, before = days.length ? endM(days.length - 1) : 0;
  days = out; if (wasToday || dayIdx > days.length - 1) dayIdx = days.length - 1;
  const [a, b] = stretchFor(dayIdx); if (loop.phase === 'walk' && b >= loop.b) { loop.a = a; loop.b = b; } else setLoop(dayIdx);
  if (ready) { checkMilestones(before, endM(days.length - 1)); updatePanel(); }
}
let ready = false, pendingDays = null;
window.SPYRJourney = {
  loadState(s) { if (!s) return; Object.assign(S, s); for (const id of S.unlocked || []) unlocked.add(id); unitC = S.unit === 'C'; musicUI(); if (ready) updateTop(true); },
  getState() { return JSON.parse(JSON.stringify(S)); },
  setSaveStatus() { },
  setDays(list) { if (ready) setDays(list); else pendingDays = list; },
};
window.__pj = { setSeason: (s) => { seasonOverride = s; updateTop(true); }, music: () => (MUSIC ? { on: MUSIC.playing, level: MUSIC.level(), state: MUSIC.state } : null), jump: (x) => { const b = x * MI; loop = { a: Math.max(0, b - 400), b, phase: 'walk', until: 0 }; camM = loop.a; updateTop(true); }, get camM() { return camM; }, get loop() { return loop; }, get jr() { return !!jr; }, setHour: (h) => { clockOverride = h; updateTop(true); }, setWx: (w) => { wxOverride = w; updateTop(true); }, goDay: (i) => { dayIdx = i; setLoop(i); updatePanel(); }, startJourney, openBook, bubbles: () => bubbles };
})();
