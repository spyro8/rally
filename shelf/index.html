<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPYR · Reading</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"></head><body><div class="firelight" aria-hidden="true"></div><div class="room-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header><a class="brand" href="#">✦ SPYR <span>SHELF</span></a><button id="host-exit" hidden aria-label="Back to SPYR">← SPYR</button></header>
<main>
<section class="cabinet" aria-label="Your bookshelves"><div class="cornice"><span>✦</span></div><div class="shelf-plant" aria-hidden="true"><span></span></div>
<div class="shelf-label" id="reading-label"><h2>Currently reading</h2><div id="reading-nav"></div></div><div class="shelf" id="reading"></div>
<div class="shelf-label" id="finished-label"><h2 id="completed-label">Completed</h2><button id="close-shelf" hidden>Close shelf</button></div><div class="shelf" id="completed"></div>
<div class="shelf-label" id="collected-label"><h2>Want to read</h2><div id="want-nav"></div></div><div class="shelf want-shelf" id="collection-slots"></div>
<div class="cabinet-vine" aria-hidden="true"><i></i></div><div class="shelf-decor" aria-hidden="true"><span class="decor-candle"></span><span class="decor-bottle"></span></div><div class="cabinet-base"></div></section>
<div class="tools"><button id="add" class="primary">+ Add a book</button><button id="stats-btn">Year in books</button></div>
<footer><div class="library-summary"><span id="count">0 finished</span><span id="minutes">0 minutes read</span></div><span id="save-status" role="status"></span><div><button id="export">Export</button><button id="import">Import</button><button id="retry" hidden>Retry save</button><input type="file" id="file" accept="application/json,.json" hidden></div></footer><p id="notice" role="status"></p>
</main>
<div id="timer-pill" class="timer-pill" hidden><span class="dot"></span><span id="timer-text"></span><button id="timer-stop">Stop</button></div>

<dialog id="add-dialog" class="wide"><button class="close" data-close aria-label="Close">×</button><small>NEW BOOK</small><h2>Add a book</h2>
<form id="search-form" class="search-row"><input id="q" type="search" placeholder="Title, author or ISBN" aria-label="Search books" autocomplete="off"><button class="primary">Search</button></form>
<p id="search-note" class="note"></p><div id="results" class="results"></div>
<button id="manual-btn" class="linkish">Can't find it? Add it by hand</button>
<form id="pick-form" hidden><div class="pick-head"><img id="pick-cover" alt=""><div><strong id="pick-title"></strong><span id="pick-author"></span></div></div>
<label>Title<input id="m-title" maxlength="160" required></label><label>Author<input id="m-author" maxlength="160"></label><label>Pages<input id="m-total" type="number" min="1" max="100000" required></label>
<div class="seg" id="pick-status"><button type="button" data-s="want">Want to read</button><button type="button" data-s="reading" class="on">Reading now</button><button type="button" data-s="completed">Finished</button></div>
<p id="pick-error" class="err" role="alert"></p><div class="actions"><button type="button" id="pick-back">Back</button><button class="primary">Add to shelf</button></div></form></dialog>

<dialog id="book-dialog" class="wide"><button class="close" data-close aria-label="Close">×</button><div id="book-view"></div></dialog>
<dialog id="edit-dialog"><button class="close" data-close aria-label="Close">×</button><small>EDIT BOOK</small><h2>Book details</h2><form id="edit-form"><label>Title<input id="e-title" maxlength="160" required></label><label>Author<input id="e-author" maxlength="160"></label><div class="fields"><label>Total pages<input id="e-total" type="number" min="1" max="100000" required></label><label>Current page<input id="e-page" type="number" min="0" required></label></div><p id="edit-error" class="err" role="alert"></p><div class="actions"><button type="button" id="edit-delete">Remove book</button><button class="primary">Save</button></div></form></dialog>
<dialog id="stats-dialog" class="wide"><button class="close" data-close aria-label="Close">×</button><div id="stats-view"></div></dialog>
<dialog id="timer-dialog"><small>READING TIMER</small><h2 id="td-title">Nice reading</h2><p id="td-copy"></p><form id="timer-form"><label>Page you're on now<input id="td-page" type="number" min="0" required></label><p id="td-error" class="err" role="alert"></p><div class="actions"><button type="button" id="td-discard">Discard</button><button class="primary">Log it</button></div></form></dialog>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="actions"><button id="cancel">Cancel</button><button id="proceed" class="primary">Confirm</button></div></dialog>
<script src="app.js" type="module"></script></body></html>
