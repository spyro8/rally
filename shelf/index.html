<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPYR · Reading</title><link rel="stylesheet" href="style.css"></head><body><div class="firelight" aria-hidden="true"></div><div class="room-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><header><button id="host-exit" hidden aria-label="Back to SPYR">← SPYR</button><a class="brand" href="#">✦ SPYR <span>SHELF</span></a><button id="add" class="primary">+ Add a book</button></header><main><section class="cabinet" aria-label="Your bookshelves"><div class="cornice"><span>✦</span></div><div class="shelf-plant" aria-hidden="true"><span></span></div><div class="shelf-label" id="reading-label"><h2>Currently reading</h2><div id="reading-nav"></div></div><div class="shelf" id="reading"></div><div class="shelf-label" id="finished-label"><h2 id="completed-label">Completed</h2><button id="close-shelf" hidden>Close shelf</button></div><div class="shelf" id="completed"></div><div class="shelf-label" id="collected-label"><h2 title="Every eight completed books becomes a shelf you can reopen.">Collection</h2></div><div class="shelf collection-shelf" id="collection-slots"></div><div class="cabinet-vine" aria-hidden="true"><i></i></div><div class="shelf-decor" aria-hidden="true"><span class="decor-candle"></span><span class="decor-bottle"></span></div><div class="cabinet-base"></div></section><section class="archive" aria-label="Full bookshelves"><div class="archive-label"><h2>Shelf collection</h2><span id="archive-count"></span></div><div id="shelves"></div><p id="archive-help">Every 8 finished books become a numbered shelf. Click a shelf to open it.</p></section><footer><div class="library-summary"><span id="count">0 finished</span><span id="minutes">0 minutes read</span></div><span id="save-status" role="status"></span><div><button id="export">Export</button><button id="import">Import</button><button id="retry" hidden>Retry save</button><input type="file" id="file" accept="application/json,.json" hidden></div></footer><p id="notice" role="status"></p></main><dialog id="book-dialog"><button class="close" id="close" aria-label="Close">×</button><form id="book-form"><small id="dialog-eyebrow">NEW BOOK</small><h2 id="dialog-title">Add to your shelf</h2><label>Title<input id="title" maxlength="160" required></label><label>Author<input id="author" maxlength="160"></label><div class="fields"><label>Total pages<input id="total" type="number" min="1" max="100000" required></label><label>Current page<input id="page" type="number" min="0" value="0" required></label></div><label id="status-field">Status<select id="book-status"><option value="reading">Currently reading</option><option value="completed">Already finished</option></select></label><div id="session-fields" hidden><label>Minutes read<input id="duration" type="number" min="1" max="1440" value="20"></label><p id="progress"></p></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="delete" hidden>Remove book</button><button class="primary" id="submit">Add book</button></div></form><div id="history"></div></dialog><dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="actions"><button id="cancel">Cancel</button><button id="proceed" class="primary">Confirm</button></div></dialog><script src="app.js" type="module"></script></body></html>
