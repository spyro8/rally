<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee8da"><title>SPYR Notebook</title><link rel="stylesheet" href="style.css"></head><body><header><span class="brand"><span class="brand-mark" aria-hidden="true">✦</span> SPYR </span><div><button id="browse">Past pages</button><button id="today" class="primary">Today’s page +</button></div><button id="host-exit" hidden aria-label="Back to SPYR">← SPYR</button></header><main><section class="notebook" aria-label="Your journal notebook"><div class="ribbon" aria-hidden="true"></div><span class="binding" aria-hidden="true"></span><div class="book"><aside><div class="specimen" aria-hidden="true"><span class="tape"></span><svg viewBox="0 0 180 150" shape-rendering="crispEdges"><path d="M90 129H87V58H91V129M89 109H70V105H88M89 96H108V92H89M89 79H71V75H89" fill="#627848"/><path d="M69 105H55V97H64V100H75V109H69M102 91V83H119V76H126V88H116V97H102M69 76H57V65H64V69H76V81H69" fill="#829353"/><path d="M87 63H80V55H67V42H72V32H85V27H97V33H108V43H112V55H100V64H87" fill="#b87172"/><path d="M78 35H87V30H95V37H105V48H97V55H80V48H72V40H78" fill="#dfabab"/><path d="M85 43H95V52H85Z" fill="#dfb96e"/><path d="M111 84V62H115V85M65 98V52H68V100" fill="#627848"/><path d="M59 42H72V47H77V55H71V60H61V55H55V48H59M106 52H118V57H123V65H117V70H107V65H101V58H106" fill="#e7d6a0"/><path d="M62 48H70V55H62M109 58H117V65H109" fill="#b78e45"/><path d="M87 117H96V121H87V117M89 121H85V133H82V126H84V119H89" fill="#ba8862"/></svg></div><div class="date-card"><div id="calendar"></div></div><div class="headline"><div id="mood" class="mood" role="group" aria-label="How are you today?"></div></div><div id="quote" class="quote"></div><footer><span>✦ SPYR</span><span id="entry-no"></span></footer></aside><article><div class="paper-top"><span id="date-label"></span><button id="change-date">Change date</button></div><label class="sr-only"
